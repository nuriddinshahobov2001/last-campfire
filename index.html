<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рассвет</title>
  <meta name="description" content="Рассвет — 2D игра на выживание в браузере. Продержись одну ночь у костра: отстреливайся от монстров, ломай ящики, побеждай боссов и дождись рассвета.">
  <meta name="theme-color" content="#05070f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Рассвет">
  <meta property="og:description" content="2D выживание в браузере: продержись ночь до рассвета.">

  <link rel="stylesheet" href="style.css">

  <div id="game"></div>
  <div id="boot">Загрузка… / Loading…</div>

    <div>Игра рассчитана на компьютер: нужны клавиатура и мышь.<br>Made for desktop: a keyboard and a mouse are required.</div>
    <button id="touch-ok" type="button">Всё равно играть / Play anyway</button>
  </div>

  <script src="boot.js"></script>
  <script src="vendor/phaser.min.js"></script>
